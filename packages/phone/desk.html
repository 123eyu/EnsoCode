<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#252529" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="EnsoCode" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>EnsoCode</title>
    <!--
      iOS 独立 PWA 只在启动时采样顶边定状态栏底色，之后不再重采：首帧前铺上次 renderer
      的边缘色（chrome.ts 写入，key 与格式同 DESK_CHROME_KEY），否则状态栏一直是启动画面的色。
    -->
    <script>
      (() => {
        try {
          const c = JSON.parse(localStorage.getItem('enso-desk-chrome') || 'null');
          const rgb = /^rgb\(\d{1,3}, \d{1,3}, \d{1,3}\)$/;
          if (!c || !rgb.test(c.top) || !rgb.test(c.bottom)) return;
          const style = document.documentElement.style;
          style.setProperty('--desk-top', c.top);
          style.setProperty('--desk-bottom', c.bottom);
          for (const m of document.querySelectorAll('meta[name="theme-color"]')) m.remove();
          const meta = document.createElement('meta');
          meta.name = 'theme-color';
          meta.content = c.top;
          document.head.prepend(meta);
        } catch {}
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--desk-top, #ffffff);
        color: #3f3f46;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      html {
        background: var(--desk-bottom, #ffffff);
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: var(--desk-top, #252529);
          color: #d4d4d8;
        }
        html {
          background: var(--desk-bottom, #252529);
        }
      }
      #frames {
        position: fixed;
        top: env(safe-area-inset-top);
        right: env(safe-area-inset-right);
        bottom: env(safe-area-inset-bottom);
        left: env(safe-area-inset-left);
      }
      #frames iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: transparent;
      }
      #frames iframe.snapshot {
        z-index: 1;
        transition: opacity 0.2s ease-out;
      }
      #frames iframe.settings {
        z-index: 2;
      }
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        text-align: center;
      }
      #splash a {
        color: #8ab4ff;
      }
      #status {
        position: fixed;
        z-index: 10;
        left: 50%;
        top: calc(env(safe-area-inset-top) + 8px);
        transform: translateX(-50%);
        padding: 4px 12px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.72);
        color: #fff;
        font-size: 12px;
        display: none;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="frames"></div>
    <div id="splash"><div id="splash-text">正在连接桌面…</div></div>
    <div id="status"></div>
    <script type="module" src="/src/desk/main.ts"></script>
  </body>
</html>
