# EnsoCode Server：中继 + 宿主 + updater（网页端「更新」由 updater 拉镜像并重建前两者）
# 部署：把本目录的 compose.yaml 与 updater.sh 放在一起，`docker compose up -d`
# 本地构建：ENSO_IMAGE=enso-server:dev docker compose build relay
services:
  relay:
    build: { context: .., dockerfile: docker/server.Dockerfile }
    image: ${ENSO_IMAGE:-ghcr.io/j3n5en/enso-server:latest}
    restart: unless-stopped
    # host 网络：浏览器与宿主都直达 :8787，WebRTC 直连不经 NAT
    network_mode: host
    command: ["enso-relay", "--listen", ":8787", "--db", "/data/relay.sqlite", "--auto-update=false"]
    volumes: [relay-data:/data]
  server:
    image: ${ENSO_IMAGE:-ghcr.io/j3n5en/enso-server:latest}
    restart: unless-stopped
    stop_grace_period: 30s
    network_mode: host
    depends_on: [relay]
    environment:
      ENSO_RELAY_URL: http://127.0.0.1:8787
      # restart 策略会拉起退出的宿主，网页端才能提供「重启服务端」
      ENSO_SUPERVISED: '1'
    volumes:
      - server-data:/data
      - workspace:/workspace
      - control:/control
  updater:
    image: docker:29-cli
    restart: unless-stopped
    entrypoint: ["sh", "/compose/updater.sh"]
    environment:
      ENSO_IMAGE: ${ENSO_IMAGE:-ghcr.io/j3n5en/enso-server:latest}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/compose:ro
      - control:/control
volumes:
  relay-data:
  server-data:
  workspace:
  control:
